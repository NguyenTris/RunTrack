services:
  db:
    image: postgres:16-alpine
    container_name: runtrack_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-runtrack_db}
      POSTGRES_USER: ${DB_USER:-runtrack_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-RunTrackSecure2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: runtrack_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-runtrack_db}
      - DB_USER=${DB_USER:-runtrack_admin}
      - DB_PASSWORD=${DB_PASSWORD:-RunTrackSecure2026}
      - SECRET_KEY=${SECRET_KEY:-runtrack_super_secret_jwt_key_2026}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - AUTO_SEED_DEMO=${AUTO_SEED_DEMO:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      - db

  web-admin:
    build:
      context: ../runtrack_web_admin
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: runtrack_web_admin
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
